services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aijinapi
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY}
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 8080
      DEFAULT_MONTHLY_REQUEST_LIMIT: 500
      ZEN_CHAT_COMPLETIONS_URL: https://opencode.ai/zen/v1/chat/completions
      ZEN_GO_CHAT_COMPLETIONS_URL: https://opencode.ai/zen/go/v1/chat/completions
      ZEN_MODELS_URL: https://opencode.ai/zen/v1/models
      ZEN_GO_MODELS_URL: https://opencode.ai/zen/go/v1/models
      UPSTREAM_MAX_ATTEMPTS: ${UPSTREAM_MAX_ATTEMPTS:-4}
      UPSTREAM_RETRY_BASE_MS: ${UPSTREAM_RETRY_BASE_MS:-300}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aijinapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - aijinapi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aijinapi"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  aijinapi-postgres:
