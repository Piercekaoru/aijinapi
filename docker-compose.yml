services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OPENCODE_ZEN_API_KEYS: ${OPENCODE_ZEN_API_KEYS:-}
      OPENCODE_GO_API_KEYS: ${OPENCODE_GO_API_KEYS:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      SERVER_HOST: ${SERVER_HOST:-127.0.0.1}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DEFAULT_MONTHLY_REQUEST_LIMIT: ${DEFAULT_MONTHLY_REQUEST_LIMIT:-500}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-xiaolinyihai@gmail.com}
      ZEN_CHAT_COMPLETIONS_URL: ${ZEN_CHAT_COMPLETIONS_URL:-https://opencode.ai/zen/v1/chat/completions}
      ZEN_GO_CHAT_COMPLETIONS_URL: ${ZEN_GO_CHAT_COMPLETIONS_URL:-https://opencode.ai/zen/go/v1/chat/completions}
      ZEN_MODELS_URL: ${ZEN_MODELS_URL:-https://opencode.ai/zen/v1/models}
      ZEN_GO_MODELS_URL: ${ZEN_GO_MODELS_URL:-https://opencode.ai/zen/go/v1/models}
      UPSTREAM_MAX_ATTEMPTS: ${UPSTREAM_MAX_ATTEMPTS:-4}
      UPSTREAM_RETRY_BASE_MS: ${UPSTREAM_RETRY_BASE_MS:-300}
      UPSTREAM_KEY_COOLDOWN_MS: ${UPSTREAM_KEY_COOLDOWN_MS:-60000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://openachieve.asia}
      APP_BASE_URL: ${APP_BASE_URL:-https://openachieve.asia}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-OpenAchieve}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      FOVPAY_ENABLED: ${FOVPAY_ENABLED:-false}
      FOVPAY_BASE_URL: ${FOVPAY_BASE_URL:-https://pay.fovpay.com}
      FOVPAY_PID: ${FOVPAY_PID:-}
      FOVPAY_SECRET_KEY: ${FOVPAY_SECRET_KEY:-}
      FOVPAY_PLUS_AMOUNT_CNY: ${FOVPAY_PLUS_AMOUNT_CNY:-58.00}
      FOVPAY_PLUS_DAYS: ${FOVPAY_PLUS_DAYS:-30}
      FOVPAY_ALLOWED_PAYTYPES: ${FOVPAY_ALLOWED_PAYTYPES:-alipay,wxpay}
      FOVPAY_DISABLED_PAYTYPES: ${FOVPAY_DISABLED_PAYTYPES:-paypal,usdt}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openachieve}
      POSTGRES_USER: ${POSTGRES_USER:-openachieve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - openachieve-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  openachieve-postgres:
