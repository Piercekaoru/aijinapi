[package]
name = "aijinapi-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.0"
actix-cors = "0.7.1"
anyhow = "1.0.100"
argon2 = "0.5.3"
bytes = "1.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.31"
hex = "0.4.3"
rand = "0.9.2"
reqwest = { version = "0.12.25", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
actix-http = "3.12.1"
actix-rt = "2.11.0"
actix-service = "2.0.3"
wiremock = "0.6.5"
